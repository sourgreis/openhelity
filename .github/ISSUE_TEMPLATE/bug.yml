name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, Windows 11
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Keyboard firmware
      description: Shown in Settings → Firmware.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from the Log tab.
      render: text
